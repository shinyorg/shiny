name: Bug Report
description: You have found something wrong with Shiny
title: "[Bug]: "
labels: [bug, unverified]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for filing an issue.  Please only file issues against the LATEST STABLE or LATEST BETA version of Shiny from Nuget (ALPHAs are not accepted for issues). 
        If you have questions, please post them in GitHub discussions. Please make sure that the component you are reporting against supports the operating systems you link.
        Documentation is at https://shinylib.net
  - type: dropdown
    id: component
    attributes:
      label: Component/Nuget
      description: The component you are filing against.  If it is not listed here it means there is no support for it.  The Blazor WASM and Linux add-on packages (ie. Shiny.Net.Http.Blazor, Shiny.Core.Linux) belong to their feature above - pick the feature and check the matching operating system below
      options:
        - Core / Foundation (Shiny.Core)
        - Hosting - MAUI (Shiny.Hosting.Maui)
        - Hosting - Native/Console (Shiny.Hosting.Native)
        - GPS or Geofencing (Shiny.Locations)
        - Jobs (Shiny.Jobs)
        - Configuration (Shiny.Extensions.Configuration)
        - HTTP Transfers (Shiny.Net.Http)
        - Network Discovery - mDNS/DNS-SD, SSDP/UPnP, WS-Discovery (Shiny.Net.Discovery)
        - Data Sync (Shiny.Data.Sync)
        - Notifications (Shiny.Notifications)
        - Push - Native (Shiny.Push)
        - Push - Azure Notification Hub (Shiny.Push.AzureNotificationHubs)
        - BluetoothLE Client (Shiny.BluetoothLE)
        - BluetoothLE Hosting (Shiny.BluetoothLE.Hosting)
        - Calendar (Shiny.Calendar)
        - Contacts (Shiny.Contacts)
        - AI Tooling (Shiny.*.Extensions.AI)
        - Other
    validations:
      required: true
  - type: checkboxes
    id: operatingsystems
    attributes:
      label: What operating system(s) are effected?  Please make sure the platform is supported for the library you are filing against.  Check https://shinylib.net for supported platforms.
      description: You may select more than one
      options:
      - label: iOS
      - label: Mac Catalyst
      - label: MacOS
      - label: Android
      - label: Windows
      - label: Blazor
      - label: Linux
      - label: Server/Console (.NET)
  - type: textarea
    validations:
      required: true
    attributes:
      label: Version(s) of Operation Systems
  - type: textarea
    validations:
      required: true
    attributes:
      label: Steps To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1.
        2.
        3.
  - type: textarea
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: textarea
    id: exception
    attributes:
      label: Exception or Log output
      description: Please copy and paste any relevant log output
  - type: textarea
    id: codesample
    attributes:
      label: Code Sample
      description: Please include a github repo with your reproducible sample

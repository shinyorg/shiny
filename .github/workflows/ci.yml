name: CI

# Every push to main, and every pull request into it: build the packages the way a release builds them, without
# publishing. Releases come from tags - see release.yml. Toolchain pins match release.yml - bump them together.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macOS, not Windows: Shiny.iOS.LiveActivities.Binding builds the ActivityKit Swift shim
    # (native/ShinyLiveActivities) through Xcode, which only exists here.
    # Directory.Build.props only adds $(WindowsTarget) on Windows hosts, so the Build step passes
    # EnableWindowsTargeting=true - drop it and every package silently loses its net11.0-windows lib.
    # xcode-27 (a preview image): macos-latest still defaults to Xcode 26, while the workloads ship the 27.x
    # iOS/macOS packs and the native Swift shims are written against the Xcode 27 SDKs.
    runs-on: xcode-27

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
          dotnet-version: '11.0.100'
          workloads: maui-ios, maui-android, maui-maccatalyst, maui-windows, macos, tvos, wasm-tools

    - name: Select Xcode 27.1
      run: sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer && xcodebuild -version

    - name: Install xcodegen
      run: brew install xcodegen

    - name: Regenerate the Xcode project
      working-directory: native/ShinyLiveActivities
      run: xcodegen generate

    - name: Compile-check the widget extension template
      working-directory: native/ShinyLiveActivities
      run: >
        xcodebuild -project ShinyLiveActivities.xcodeproj
        -scheme ShinyLiveActivityWidgetTemplate
        -sdk iphonesimulator -configuration Release
        build CODE_SIGNING_ALLOWED=NO

    - name: Build
      run: dotnet build Build.slnf /restore -m -property:Configuration=Release -property:EnableWindowsTargeting=true

    - name: Publish Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: nugets
        path: |
          src/**/bin/Release/*.nupkg
          src/**/bin/Release/*.snupkg
        retention-days: 5

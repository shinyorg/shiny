name: Deploy Blazor Sample

on:
  workflow_dispatch:
  push:
    branches:
      - v5
    paths:
      - 'samples/Sample.Blazor/**'
      - 'src/**/*.Blazor/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'Directory.Build.targets'
      - '.github/workflows/deploy-blazor-sample.yml'

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  BASE_HREF: /shiny/
  SAMPLE_CSPROJ: samples/Sample.Blazor/Sample.Blazor.csproj

jobs:
  build:
    # macOS so the multi-target src libs (net10.0-ios, net10.0-android, …) can
    # resolve their workload packs during project-graph restore. Linux runners
    # fail with NETSDK1178 on Microsoft.iOS.Sdk.net10.0_26.x packs.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # Nerdbank.GitVersioning needs full history

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore workloads
        run: dotnet workload restore "${{ env.SAMPLE_CSPROJ }}"

      - name: Publish
        run: dotnet publish "${{ env.SAMPLE_CSPROJ }}" -c Release -o publish

      - name: Rewrite base href + add SPA fallback
        run: |
          # -i.bak is the only -i form that works the same on both BSD (macOS) and GNU sed.
          sed -i.bak -E 's|<base href="/" ?/>|<base href="${{ env.BASE_HREF }}" />|g' publish/wwwroot/index.html
          rm publish/wwwroot/index.html.bak
          grep -q '<base href="${{ env.BASE_HREF }}"' publish/wwwroot/index.html || { echo "base href rewrite failed"; exit 1; }
          cp publish/wwwroot/index.html publish/wwwroot/404.html
          touch publish/wwwroot/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

name: Sync Skills to Skills Repository

on:
  push:
    branches:
      - main
      - master
      - v*
    paths:
      - 'skills/**'
  workflow_dispatch:

jobs:
  sync-skills:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout skills repository
        uses: actions/checkout@v4
        with:
          repository: shinyorg/skills
          token: ${{ secrets.SKILLS_REPO_TOKEN }}
          path: skills-repo

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync skills directory
        env:
          PLUGIN_NAME: shiny-client
        run: |
          target_dir="skills-repo/plugins/$PLUGIN_NAME/skills"
          mkdir -p "$target_dir"
          for skill_dir in source/skills/*/; do
            skill_name=$(basename "$skill_dir")
            echo "Syncing skill: $skill_name -> plugins/$PLUGIN_NAME/skills/$skill_name"
            rm -rf "$target_dir/$skill_name"
            cp -r "$skill_dir" "$target_dir/$skill_name"
          done

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.SKILLS_REPO_TOKEN }}
          path: skills-repo
          commit-message: "Update Shiny skills from shiny repository"
          title: "Update Shiny skills"
          body: |
            This PR updates Shiny skills from the [Shiny repository](https://github.com/shinyorg/shiny).

            **Source commit:** ${{ github.sha }}
            **Triggered by:** @${{ github.actor }}
            ---
            *This PR was automatically created by the [sync-skills workflow](https://github.com/shinyorg/shiny/actions/workflows/sync-skills.yml).*
          branch: update-shiny-skills
          delete-branch: true
          labels: |
            automated
            skills-update

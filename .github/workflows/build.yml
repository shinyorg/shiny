name: Build

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
  push:
    branches:
      - preview
      - v*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NugetApiKey: ${{secrets.NUGETAPIKEY}}

jobs:
  build:
    permissions:
      id-token: write   # required for NuGet trusted publishing (OIDC)
      contents: read

    runs-on: windows-latest
#    runs-on: macos-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
          fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
          dotnet-version: '10.0.300'
          workloads: maui-ios, maui-android, maui-maccatalyst, maui-windows, macos, tvos, wasm-tools

    - name: Build
      run: dotnet build Build.slnf /restore -m -property:Configuration=Release -property:PublicRelease=true

    - name: Publish Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: nugets
        path: ${{ github.workspace }}/artifacts
        retention-days: 5

    - name: NuGet Login (OIDC)
      id: nuget-login
      if: ${{ github.ref == 'refs/heads/preview' || startsWith(github.ref, 'refs/heads/v') }}
      uses: NuGet/login@v1
      with:
        user: aritchie

    - name: Publish NuGets
      if: ${{ github.ref == 'refs/heads/preview' || startsWith(github.ref, 'refs/heads/v') }}
      run: dotnet nuget push **\*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate